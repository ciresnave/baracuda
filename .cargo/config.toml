# Baracuda cargo configuration.
#
# NOTE: intentionally minimal — no `[build] rustflags` (e.g. target-cpu=native).
# Global rustflags force a full workspace rebuild and change codegen for every
# crate; keep them out of the committed config so a clean checkout builds fast
# and reproducibly.

[alias]
# Run on-device (`#[ignore]`d) GPU tests through the machine-wide `gpu-run` lock.
# This is the SANCTIONED way to run device tests: lock acquisition is structural
# (the xtask subcommand *is* the wrapper call), so a device run cannot silently
# skip the mutex — the "convention in a docs file is not a control" failure the
# 2026-07-31 host-aperture postmortem indicts.
#
#   cargo gpu-test -p <crate> --test <name>            # scoped (preferred)
#   cargo gpu-test -p <crate> --test <name> -- --nocapture
#
# Compiles UNLOCKED, then runs the device tests LOCKED. See `xtask test-gpu`.
#
# ⚠ The COMPILE is unlocked, so its ~45-90 min CUDA forge does NOT enter the machine-wide
# `cuda-build` slot budget, and it can oversubscribe host address space (the forge warns
# `ptxas 'Memory allocation failure'` and the build is killed). The likely cause is a
# SINGLE forge oversubscribing on its own: `baracuda-kernels-sys` runs its nvcc pool at
# ~50% of cores, and each nvcc spawns `cicc`/`ptxas` children (~2 processes/thread), which
# can exceed the host address-space ceiling by itself — with NO other project building
# (observed 2026-08-27; Fuel's build log was clean at the time). A concurrent CUDA build
# in another project can compound it but is possible-not-observed. Both `cargo -j N` and
# `BARACUDA_FORGE_THREADS` cap the forge: `-j N` is honoured as an UPPER bound (it lowers
# the ~50%-of-cores default, never raises it — see `baracuda-forge`'s `parallel.rs`), and
# `BARACUDA_FORGE_THREADS` is an absolute override checked first. If it hits you, cap the
# forge and reuse a warm cache:
#   $env:BARACUDA_FORGE_THREADS=6; cargo gpu-test -p <crate> --test <name>   # PowerShell (primary)
#   BARACUDA_FORGE_THREADS=6 cargo gpu-test -p <crate> --test <name>         # bash
# (A machine-wide `cuda-build` slot-mutex spanning the compile phase is the broader
# cross-project coordination fix — tracked with the Fuel architect; but the env cap is
# what fixes the self-oversubscription today.)
gpu-test = "run -q -p xtask -- test-gpu"
