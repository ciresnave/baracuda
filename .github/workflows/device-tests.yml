        run: cargo gpu-test -p baracuda-tensorrt --features device-tests
      - name: Upload run record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: device-test-results
          path: |
            device-test-results.json
            device-test-results-kernels.json
            device-test-results-kernels-quant.json
