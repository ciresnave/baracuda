name: Device tests (self-hosted)

# Runs the on-device tests on the maintainer's GPU laptop. See docs/DEVICE-TESTS.md.
#
# SECURITY (public repo): this job runs on a self-hosted machine, so it must never run
# code from a fork. Triggers are limited to push to main, a schedule, and manual
# dispatch — all of which run only code that is already on `main` or that a maintainer
# chose to dispatch. There is deliberately NO `pull_request` trigger.
#
# INERT until the repository variable DEVICE_RUNNER_ENABLED is 'true' (set only after
# the runner is registered).
on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  BARACUDA_RESULTS_FILE: device-test-results.json

jobs:
  device:
    name: baracuda-driver on-device tests
    if: vars.DEVICE_RUNNER_ENABLED == 'true'
    runs-on: [self-hosted, windows, gpu, baracuda]
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # Takes the machine-wide gpu-run lock (shared with Fuel/Vulkane) and fails the step
      # if any test fails, if a required device resource is absent, or if 0 tests passed.
      - name: cargo gpu-test (baracuda-driver, device-tests)
        shell: bash
        run: |
          WSVER="$(sed -n 's/^version = "\(.*\)"/\1/p' crates/baracuda-types/Cargo.toml | head -1)"
          [ -n "$WSVER" ] || { echo "cannot derive the workspace version"; exit 1; }
          cargo gpu-test -p baracuda-driver@$WSVER --features device-tests
      - name: cargo gpu-test (baracuda-kernels, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-kernels.json
        run: cargo gpu-test -p baracuda-kernels --features device-tests
      # marlin / awq are off by default, so the step above compiles their tests to
      # empty binaries; this one enables them. Scoped to the quantised-GEMM tests.
      - name: cargo gpu-test (baracuda-kernels, marlin + awq, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-kernels-quant.json
        run: cargo gpu-test -p baracuda-kernels --features marlin,awq,device-tests --test marlin_reference --test awq_reference --test marlin_smoke --test awq_smoke --test gptq_to_marlin_smoke
      - name: cargo gpu-test (baracuda-cutlass, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-cutlass.json
        run: cargo gpu-test -p baracuda-cutlass --features device-tests,ozimmu
      - name: cargo gpu-test (baracuda-flashinfer, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-flashinfer.json
        run: cargo gpu-test -p baracuda-flashinfer --features flashinfer,device-tests
      - name: cargo gpu-test (baracuda-ozimmu, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-ozimmu.json
        run: cargo gpu-test -p baracuda-ozimmu --features device-tests
      - name: cargo gpu-test (baracuda-kernels-bench, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-kernels-bench.json
        run: cargo gpu-test -p baracuda-kernels-bench --features sm89,device-tests
      - name: cargo gpu-test (baracuda-cuda-emit, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-cuda-emit.json
        run: cargo gpu-test -p baracuda-cuda-emit --features nvrtc,device-tests
      - name: cargo gpu-test (baracuda-cuda-seam, device-tests)
        shell: bash
        env:
          BARACUDA_RESULTS_FILE: device-test-results-cuda-seam.json
        run: cargo gpu-test -p baracuda-cuda-seam --features nvrtc,device-tests
      - name: cargo gpu-test (baracuda-runtime, device-tests)
        shell: bash
        env:
