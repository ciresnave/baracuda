name: CI

on:
  push:
    branches: [main]

  # NO `branches:` filter on pull_request, deliberately. With `branches: [main]`
  # a PR based on any other branch got NO CI AT ALL — not red, not pending,
  # ABSENT — so a stacked PR was indistinguishable from a PR with nothing wrong,
  # the one failure shape that leaves no artefact to misread. Hit stacking #34 on
  # #33: it carried only third-party checks until a close/reopen forced a run.
  #
  # Retargeting a PR's base fires `edited`, which is NOT in the default
  # opened/synchronize/reopened set, so a retarget alone still starts no run —
  # push to the PR, or close and reopen it. Opting `edited` in would fix the
  # retarget case but also fire on every title/body edit, trading a frequent
  # waste for a rare inconvenience, so we don't.
  #
  # `push` stays scoped to main on purpose: an open PR already gets a run on
  # every push via `synchronize`, so widening this would double every run rather
  # than close a gap. Shape adopted from vulkane#31 — same blind spot, same fix.
  pull_request:

# Least privilege: every job only checks out and builds. Raise per job if one ever needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-no-cuda:
    name: Build without CUDA installed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # rustfmt directly (chunked) instead of `cargo fmt --all`: on Windows the
      # latter spawns rustfmt with EVERY workspace file on one command line and
      # overflows the arg-length limit (`os error 206`). `git ls-files | xargs`
      # chunks the file list so it never overflows, cross-platform via `shell:
      # bash` (Git Bash on windows-latest). `--edition 2024` matches the
      # workspace edition (cargo-fmt would forward it from the manifest); the
      # `--style-edition 2024` pin makes rustfmt honor the strict-2024 style +
      # rustfmt.toml. `tools/` is a separate workspace (different edition) and is
      # excluded, matching `cargo fmt --all`'s workspace-member scope.
      - name: cargo fmt (workspace, chunked)
        shell: bash
        # NUL-delimited throughout (-z / -0) so paths with spaces or other
        # shell-special characters are handled robustly, never word-split.
        run: git ls-files -z -- '*.rs' | grep -zv '^tools/' | xargs -0 -n 40 rustfmt --check --edition 2024 --style-edition 2024
      # Test-crate-locality guard: a test in crates/A/tests/ runs only under
      # `cargo test -p A`, so a test that exercises crate B's behaviour from A's
      # tests/ runs in a context whose property it does not guard, with its count
      # right and its coverage misplaced. This is a structural check no cargo
      # invocation makes; see docs/design/2026-08-20-ci-coverage-matrix.md §3.2.
      - name: test-crate-locality guard
        shell: bash
        run: bash scripts/check-test-crate-locality.sh
      # Feature-coverage guard: a `#[cfg(feature="X")]`-gated body that no CI job
      # builds is invisible — a break there ships green (the class that broke
      # Fuel's `--features vulkan` for 72 min). Asserts every feature-gated crate
      # is classified + covered, over the SET not a count, that the ALL_FEATURES
      # steps actually exist here, and that no `--all-features` step pulls an
      # unconditional-nvcc crate (which SKIPS not fails on a no-CUDA runner =
      # vacuous green). See docs/design/2026-08-20-ci-coverage-matrix.md §Feature.
      - name: feature-coverage guard
        shell: bash
        run: bash scripts/check-feature-coverage.sh
      # Benchmark-provenance guard: BENCHMARKS.md states its hardware TWICE, and
      # `tools/build_benchmarks_table.py` rewrites only what lies BETWEEN its
      # markers — so the top-level `**Hardware**:` header is structurally
      # unreachable to the tool that maintains the file and drifts on every regen.
      # It said "RTX 4070, CUDA 13.0" from 2026-05-28 until 2026-09-06 while the
      # generated preamble said "RTX 4070 Laptop GPU"; #74 corrected the inner
      # copy and could not reach the outer one. Different parts, different SM
      # count and bandwidth. Asserts the two name the same PART (not that they are
      # byte-identical — they serve different readers and word it differently).
      - name: benchmark-provenance guard
        shell: bash
        run: bash scripts/check-benchmark-provenance.sh
      # Device-run-invocation guard: CONTRIBUTING step 3 requires on-device tests to
      # go through `cargo gpu-test`, which holds the machine-wide `gpu-run` mutex —
      # the box is SHARED with other projects and concurrent device runs collide
      # (2026-07-31 host-aperture postmortem). Four docs instructed raw
      # `cargo test -- --ignored` anyway, and a reader asking "how do I run these"
      # opens the crate README, not CONTRIBUTING. .cargo/config.toml already names
      # the class: "a convention in a docs file is not a control". This makes it one.
      - name: device-run-invocation guard
        shell: bash
        run: bash scripts/check-device-run-invocations.sh
      # Crate-licence guard: `MIT OR Apache-2.0` requires the licence text to
      # travel with every copy, and a published crate contains only files from its
      # own directory. alpha.79 shipped 69 crates with no licence text (the
      # per-crate copies came after it, #18), and `baracuda-cuda-vocab` was created
      # after that sweep and missed it, which held the alpha.80 publish.
      # `scripts/publish.ps1` runs the same script and refuses to publish on failure.
      - name: crate-licence guard
        shell: bash
        run: |
          PY="$(command -v python3 || command -v python)"
          "$PY" --version
          "$PY" scripts/check-crate-licences.py
      # ---- The workspace steps below are scoped to the DRIVER-FREE surface.
      # This is a CUDA library: its `-sys` kernel crates compile `.cu` via nvcc
      # in their build scripts, so a full `--workspace` build genuinely cannot
      # succeed on a machine without the CUDA toolkit (the arch features that
      # drive the nvcc build are default-on and deeply chained). The purpose of
      # this job is to guard the Baracuda crates that ARE designed to build
      # anywhere — the CUDA emitter `baracuda-cuda-emit` (pure-Rust IR->.cu; the
      # neutral generator + classifier vocab it consumes are now the external
      # `unpopped` / `unpopped-vocab`, guarded in their own repo) and the `cuda:`
      # §6.8 vocabulary owner `baracuda-cuda-vocab` — for missing_docs, clippy,
      # and tests. The CUDA-dependent crates (and
      # cuda-emit's real `nvrtc` feature) are validated LOCALLY on the maintainer's
      # RTX 4070 box — there is NO CI CUDA runner (this workflow is one no-CUDA job
      # on ubuntu+windows). A prose claim of a runner that does not exist reads to a
      # careful reviewer as coverage that isn't there; see docs/design/2026-08-20-ci-coverage-matrix.md.
      # (build.rs of baracuda-cutlass-kernels-sys now degrades gracefully when
      # nvcc is absent, so an accidental CUDA-crate build here warns instead of
      # panicking — but it is still not built by this job.)
      # `baracuda-bench-stats` (board #162, docs/design/2026-10-09-kernel-perf-
      # baseline-design.md) is the ONE part of the kernel-perf-baseline tooling
      # with no CUDA dependency — the stats/machine-state/baseline-key types
      # plus pure text parsers for nvidia-smi/powercfg output. Everything else
      # that TOUCHES a device lives in baracuda-kernels-bench instead, which
      # this job still only `cargo check`s (see arch-gated-check below) because
      # it genuinely needs a GPU. Added here, not there, specifically so this
      # crate's tests EXECUTE on a GPU-less runner instead of only type-checking.
      - name: cargo build (driver-free surface)
        run: cargo build --locked -p baracuda-cuda-emit -p baracuda-cuda-vocab -p baracuda-cuda-parse -p baracuda-bench-stats
      - name: cargo clippy (driver-free surface)
        run: cargo clippy --locked -p baracuda-cuda-emit -p baracuda-cuda-vocab -p baracuda-cuda-parse -p baracuda-bench-stats -- -D warnings
      # Also lint in TEST mode. The step above compiles the lib with cfg(test)
      # FALSE, so a lint in an inline `#[cfg(test)]` module or in an integration
      # test file (tests/*.rs) is never compiled and never seen — the same "CI
      # never built it" gap as the feature surfaces below (a `single_element_loop`
      # in a lib inline test rode in unnoticed until a `--tests` run found it).
      # `--tests` compiles the lib-test target plus every tests/*.rs.
      - name: cargo clippy (driver-free surface, tests)
        run: cargo clippy --locked -p baracuda-cuda-emit -p baracuda-cuda-vocab -p baracuda-cuda-parse -p baracuda-bench-stats --tests -- -D warnings
      - name: cargo test (driver-free surface, no GPU)
        run: cargo test --locked -p baracuda-cuda-emit -p baracuda-cuda-vocab -p baracuda-cuda-parse -p baracuda-bench-stats
      # `cargo doc` is also the ENFORCEMENT point for `[workspace.lints.rustdoc]`
      # (broken_intra_doc_links + private_intra_doc_links = deny). A broken
      # `[`Type`]` link is invisible to build/clippy/test — it renders as a live
      # cross-reference and is dead on click — so without a doc build in CI a link
      # that stopped resolving after a rename ships silently. Scoped to the
      # driver-free crates that document without the CUDA toolkit. A pre-declared
      # born-red sweep (inject one broken link per crate, expect all to redden)
      # confirmed the deny fires on each: 8 of 8 in the original sweep, plus
      # baracuda-cuda-vocab born-red-verified when it was added (exit 101,
      # `-D rustdoc::broken-intra-doc-links`). Across THIS JOB'S TWO doc steps that is
      # the 7 crates below plus the 2 cuvs crates in the feature-gated
      # `cargo doc cuvs surfaces` step later (a crate that failed to redden would be
      # silently un-gated). CUDA-only crates' rustdoc is checked on-device.
      - name: cargo doc (driver-free surface — enforces rustdoc deny)
        run: >
          cargo doc --locked --no-deps
          -p baracuda-cuda-emit
          -p baracuda-cuda-seam
          -p baracuda-cuda-vocab
          -p baracuda-cuda-parse
          -p baracuda-types
          -p baracuda-types-derive
          -p baracuda-build
          -p baracuda-core
          -p baracuda-kernels-types
          -p baracuda-bench-stats
      # ---- feature-gated surfaces the default --workspace build never compiles.
      # These features are deliberately CI-safe: `cuvs` is a lazy dynamic loader
      # (no RAPIDS needed to build/test; GPU-touching tests are #[ignore]d),
      # `baracuda-cuda-seam` (the Fuel seam, split out of cuda-emit) pulls Rust git deps only, and `convert` pulls
      # unpopped's cc-built tree-sitter grammars (a C compiler, not CUDA). All
      # build here. Regression guard for the class of bug where `missing_docs =
      # deny` (and clippy) never fired on a feature-gated module because CI never
      # compiled it — and its sharper variant, a whole test file (tests/convert.rs)
      # that broke against an unpopped API rename while CI stayed green because
      # nothing ever built it. A test absent from the build graph is
      # indistinguishable from a passing one.
      #
      # COVERED by these no-CUDA runners: default, `baracuda-cuda-seam`, `convert`, and `cuvs`
      # (on the cuvs crates). NOT COVERED here: `nvrtc` — and therefore
      # `--all-features`, which enables it — because nvrtc needs the CUDA toolkit;
      # those are validated LOCALLY on the 4070 box — there is no CI CUDA runner —
      # not on this job.
      # If you add a feature, add its build here or it joins the uncovered set.
      - name: clippy cuvs surfaces (feature-gated)
        run: cargo clippy --locked -p baracuda-cuvs-sys -p baracuda-cuvs --features cuvs -- -D warnings
      - name: test cuvs surfaces (feature-gated)
        run: cargo test --locked -p baracuda-cuvs-sys -p baracuda-cuvs --features cuvs
      - name: cargo doc cuvs surfaces (feature-gated — enforces rustdoc deny)
        run: cargo doc --locked --no-deps -p baracuda-cuvs-sys -p baracuda-cuvs --features cuvs
      - name: clippy cuda-seam
        run: cargo clippy --locked -p baracuda-cuda-seam -- -D warnings
      - name: clippy cuda-seam (tests)
        run: cargo clippy --locked -p baracuda-cuda-seam --tests -- -D warnings
      - name: test cuda-seam
        run: cargo test --locked -p baracuda-cuda-seam
      - name: clippy cuda-emit convert (feature-gated)
        run: cargo clippy --locked -p baracuda-cuda-emit --features convert -- -D warnings
      - name: clippy cuda-emit convert (feature-gated, tests)
        run: cargo clippy --locked -p baracuda-cuda-emit --features convert --tests -- -D warnings
      - name: test cuda-emit convert (feature-gated)
        run: cargo test --locked -p baracuda-cuda-emit --features convert
      # `tools/kiss-ref-diff` is not a workspace member and declares its OWN
      # [workspace], so it is a SECOND RESOLUTION ROOT: the root Cargo.lock
      # structurally cannot see its graph, and no job here had ever compiled it.
      # Its `unpopped` pins went nine minors stale and it stopped building --
      # `Cuda: Backend` unsatisfied, because two versions of one crate are two
      # distinct traits. Nothing reported it (#122).
      #
      # ⚠️ RUNNING it needs a CUDA toolkit + a GPU; TYPE-CHECKING it needs
      # neither, and that conflation is why it rotted. ~18s cold.
      #
      # ⚠️ WHAT WOULD MAKE THIS WRONG: this step does NOT run the differential.
      # If the tool's value ever depends on CI executing it, this silence stops
      # being honest and it needs a device runner or an explicit uncovered row.
      - name: cargo check tools/kiss-ref-diff (second resolution root)
        # `--locked` (SUP-001): this tool is its own resolution root, so it carries its own
        # committed Cargo.lock. It path-depends on workspace crates, so the lock records their
        # versions: any version bump that touches them must regenerate it
        # (`cargo generate-lockfile --manifest-path tools/kiss-ref-diff/Cargo.toml`); a stale lock
        # fails this step on purpose.
        run: cargo check --locked --manifest-path tools/kiss-ref-diff/Cargo.toml
      # ---- FEATURE-COVERAGE: clippy the CUDA-FREE feature-gated surface under
      # `--all-features`. Only 7 crates invoke nvcc; the rest of the CUDA wrapper
      # stack is lazy-libloading and builds without the toolkit, so its
      # feature-gated code (half-crate impls on cudnn/nccl/megatron/cuvs, the
      # umbrella's 20 `pub use` gates, driver test-support, runtime interop, nvrtc)
      # is CI-buildable and was previously unbuilt — the blind spot this closes.
      # `--all-features` is self-maintaining (a new feature auto-joins); verified
      # via `--message-format json` that this graph pulls NO nvcc crate, so it
      # compiles real wrapper code rather than skipping-green on a toolkit-less
      # runner. The feature-coverage guard enforces both properties.
      - name: clippy feature-gated surface (--all-features, CUDA-free)
        run: >
          cargo clippy --locked --all-features
          -p baracuda
          -p baracuda-build
          -p baracuda-types
          -p baracuda-cudnn
          -p baracuda-nccl
          -p baracuda-megatron
          -p baracuda-runtime
          -p baracuda-driver
          -p baracuda-cuvs
          -p baracuda-cuvs-sys
          -p baracuda-cuda-emit
          -p baracuda-cuda-seam
          -- -D warnings
      # baracuda-optim is MIXED: `distributed_optim` is CUDA-free but `sm80/89/90a`
      # invoke nvcc, so `--all-features` can't be used — enumerate the CUDA-free one.
      - name: clippy baracuda-optim distributed_optim (feature-gated, CUDA-free)
        run: cargo clippy --locked -p baracuda-optim --features distributed_optim -- -D warnings
      # Device-test targets are gated behind the `device-tests` feature, not `#[ignore]`d.
      # They COMPILE without CUDA (libloading), so type-check + lint them here on every PR:
      # a gated test that CI never builds is indistinguishable from a passing one. They are
      # RUN by .github/workflows/device-tests.yml on the self-hosted device runner, and a
      # stale run is caught by device-tests-detector.yml. See docs/DEVICE-TESTS.md.
      - name: clippy device-tests targets (type-check, CUDA-free)
        run: cargo clippy --locked -p baracuda-driver --tests --features device-tests -- -D warnings
      - name: clippy baracuda-runtime --tests (device-tests off / on)
        run: |
          cargo clippy --locked -p baracuda-runtime --tests -- -D warnings
          cargo clippy --locked -p baracuda-runtime --tests --features device-tests -- -D warnings

  msrv-driver-free:
    name: MSRV 1.85 (driver-free surface)
    # The declared `rust-version = 1.85` is inherited by exactly the driver-free
    # crates (see the scoping note in [workspace.package], root Cargo.toml). This
    # job EXERCISES that floor by building those crates under 1.85.0 — an MSRV
    # nothing builds under is a promise with no gate behind it. The CUDA crates
    # deliberately declare NO floor (unbuildable without the CUDA toolkit; this
    # repo has no CUDA runner), so they are absent here by design, not omission.
    # `+1.85.0` overrides the repo's rust-toolchain.toml pin (1.98.0);
    # dtolnay/rust-toolchain@1.85.0 installs the toolchain that `+1.85.0` selects.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@69084b241933c14c2fa24234c4596f11a2655339 # 1.85.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: MSRV — build exactly the crates that declare rust-version=1.85, under 1.85.0
        shell: bash
        # Derive the set to build from `cargo metadata` (the per-crate Cargo.toml
        # declarations are the source of truth), assert it is non-empty AND equals
        # the expected enumeration, then build that derived set. A HARDCODED -p list
        # drifts silently from the declarations: delete a crate's `rust-version` and
        # its floor stops being tested while this job still passes green. Here a
        # deletion from EITHER side reds — the gate discriminates on its own
        # configuration, not only on code. (metadata, not a glob, is what caught
        # xtask slipping into the 1.85 set in the first place.)
        run: |
          expected="baracuda-build baracuda-core baracuda-cuda-emit baracuda-cuda-vocab baracuda-types baracuda-types-derive"
          exp=$(printf '%s\n' $expected | sort | tr '\n' ' '); exp="${exp% }"
          names=$(cargo +1.85.0 metadata --locked --no-deps --format-version 1 \
            | python3 -c "import json,sys; print(' '.join(sorted(p['name'] for p in json.load(sys.stdin)['packages'] if p.get('rust_version')=='1.85')))")
          echo "crates declaring rust-version=1.85: [$names]"
          [ -n "$names" ] || { echo "GUARD BROKEN: no crate declares rust-version=1.85 — this job would build nothing."; exit 2; }
          [ "$names" = "$exp" ] || { echo "MSRV DRIFT: {declares 1.85}=[$names] != {expected}=[$exp]. A crate gained or lost its 1.85 floor, or the 'expected' list was edited — reconcile the Cargo.toml declarations with the list in this step."; exit 1; }
          args=(); for n in $names; do args+=(-p "$n"); done
          cargo +1.85.0 build --locked "${args[@]}"

  arch-gated-check:
    name: Arch-gated Rust surface (DOCS_RS check, no CUDA)
    # THE CLASS behind the int4_gemm sm89 break this workflow's PR fixes:
    # `baracuda-kernels` has arch-gated Rust (`#[cfg(feature = "sm80" | "sm89" |
    # "sm90a")]`) that NO other CI job compiles. The default driver-free build
    # skips it (arch features off), and the real forge build (`--features smXX`)
    # only runs on the maintainer's RTX 4070 box — there is no CI CUDA runner. So
    # a name-resolution / type error in an arch-gated path ships GREEN: an int4
    # bias path matched `BiasElementKind::{F32,I32}` while importing only the
    # `BiasElement` trait, and `cargo bench --features sm89` (the bench suite's
    # documented invocation) failed to compile on main with E0433 x32 — nothing
    # said so, because CI never built that surface.
    #
    # This type-checks the arch-gated surface WITHOUT the CUDA toolkit: `DOCS_RS`
    # makes BOTH baracuda-kernels-sys and baracuda-cutlass-kernels-sys skip their
    # nvcc build (each build.rs early-returns before any toolkit lookup), and
    # `cargo check` type-checks without linking, so the absent kernel symbols
    # never matter. It compiles the exact `#[cfg(feature = smXX)]` Rust the forge
    # build would — catching the E0433 class on a driver-free runner in ~10-30s.
    #
    # Born-red verified: with the `BiasElementKind` import removed this check reds
    # (`error[E0433]` x32, exit 101) on `--features sm89`; with the fix it is exit
    # 0 on all three arches, and 0 nvcc/cicc/ptxas processes spawn — the forge is
    # genuinely skipped, so this is safe on a toolkit-less runner. See
    # docs/design/2026-08-20-ci-coverage-matrix.md for the surrounding no-CUDA
    # coverage rationale.
    strategy:
      fail-fast: false
      matrix:
        arch: [sm80, sm89, sm90a]
    runs-on: ubuntu-latest
    env:
      # kernels-sys + cutlass-kernels-sys skip nvcc under DOCS_RS → driver-free.
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check baracuda-kernels --features ${{ matrix.arch }}
        run: cargo check --locked -p baracuda-kernels --features ${{ matrix.arch }}
      # The kernels' on-device test targets are gated behind the `device-tests` feature (not
      # `#[ignore]`d). They compile without CUDA (DOCS_RS stubs the kernel crates), so type-check
      # both builds on every PR: with the feature (the gated tests still build) and without it
      # (the always-on tests build). RUN by .github/workflows/device-tests.yml on the self-hosted
      # device runner; see docs/DEVICE-TESTS.md.
      - name: cargo check baracuda-kernels --tests (device-tests off)
        run: cargo check --locked -p baracuda-kernels --tests --features ${{ matrix.arch }}
      - name: cargo check baracuda-kernels --tests (device-tests on)
        run: cargo check --locked -p baracuda-kernels --tests --features ${{ matrix.arch }},device-tests
      # marlin / awq are off by default, so the two blocks above never compiled
      # tests/{marlin,awq}_*.rs; a view-field privatisation broke them unseen.
      - name: cargo check baracuda-kernels --tests (marlin + awq + device-tests)
        run: cargo check --locked -p baracuda-kernels --tests --features ${{ matrix.arch }},marlin,awq,device-tests
      # baracuda-cutlass's device tests are gated the same way; its features are sm80/sm90a
      # only (no sm89), so type-check the default build once, on the sm80 leg.
      - name: cargo check baracuda-cutlass --tests (device-tests off)
        if: matrix.arch == 'sm80'
        run: cargo check --locked -p baracuda-cutlass --tests
      - name: cargo check baracuda-cutlass --tests (device-tests on)
        if: matrix.arch == 'sm80'
        run: cargo check --locked -p baracuda-cutlass --tests --features device-tests
      - name: cargo check baracuda-flashinfer --tests (device-tests off / on)
        if: matrix.arch == 'sm80'
        run: |
          cargo check --locked -p baracuda-flashinfer --tests --features flashinfer
          cargo check --locked -p baracuda-flashinfer --tests --features flashinfer,device-tests
      - name: cargo check baracuda-ozimmu / cutlass+ozimmu --tests (device-tests off / on)
        if: matrix.arch == 'sm80'
        run: |
          cargo check --locked -p baracuda-ozimmu --tests
          cargo check --locked -p baracuda-ozimmu --tests --features device-tests
          cargo check --locked -p baracuda-cutlass --tests --features device-tests,ozimmu
      - name: cargo check baracuda-cublas / transformer-engine / optim --tests (device-tests off / on)
        if: matrix.arch == 'sm80'
        run: |
          cargo check --locked -p baracuda-cublas --tests
          cargo check --locked -p baracuda-cublas --tests --features device-tests
          cargo check --locked -p baracuda-transformer-engine --tests --features sm80
          cargo check --locked -p baracuda-transformer-engine --tests --features sm80,device-tests
          cargo check --locked -p baracuda-optim --tests --features sm80,distributed_optim
          cargo check --locked -p baracuda-optim --tests --features sm80,distributed_optim,device-tests
      # The libloading-based library crates (cuDNN, NCCL, cuFFT, ...): their device tests are gated
      # behind `device-tests` and compile without the library installed, so type-check both states.
      - name: cargo check library crates --tests (device-tests off / on)
        if: matrix.arch == 'sm80'
        run: |
          for c in cudf cudnn cufft cufile curand cusolver cusparse cutensor cuvs cvcuda megatron nccl npp nvcomp nvimagecodec nvjitlink nvjpeg nvml nvrtc nvshmem tensorrt; do
            cargo check --locked -p "baracuda-$c" --tests
            cargo check --locked -p "baracuda-$c" --tests --features "$([ "$c" = cuvs ] && echo cuvs,)device-tests"
          done
          cargo check --locked -p baracuda-cuvs --tests --features cuvs
      # `baracuda-kernels-bench`'s tests/ are 12 files / 3,103 lines that NO job
      # compiled until this step: the variant gate, the RowReduce bit-move matrix
      # and the precision-first numerics all live there. They are device tests, so
      # they cannot RUN here — but they are ordinary Rust, and an upstream rename
      # breaks them exactly like anything else. Measured twice in two days: the
      # `unpopped` 0.11.0 `VariantFidelity` rename touched `variant_gate.rs`, and
      # the only thing that caught it was a mutation run BY HAND on a maintainer's
      # box. A guard whose sole instance is "someone remembered" is a habit, not a
      # guard.
      #
      # ⚠️ THIS STEP TYPE-CHECKS; IT DOES NOT RUN. `--tests` builds the test
      # targets and stops. A green here means "these tests still compile against
      # their dependencies", NEVER "these tests pass" — the on-device legs need a
      # GPU and stay correctly outside the gated surface (see
      # docs/design/2026-08-20-ci-coverage-matrix.md).
      #
      # ⚠️ WHAT WOULD MAKE THIS COMMENT WRONG: if the bench crate ever gains a
      # test whose value is in EXECUTING on a driver-free runner, this step's
      # silence about pass/fail stops being honest, and that test needs either a
      # device runner or an explicit uncovered row — not this check. The claim
      # here is deliberately the smaller one, because it is the one that was
      # failing.
      - name: cargo check baracuda-kernels-bench --tests --features ${{ matrix.arch }}
        run: cargo check --locked -p baracuda-kernels-bench --tests --features ${{ matrix.arch }}
      - name: cargo check baracuda-kernels-bench --tests --features device-tests
        run: cargo check --locked -p baracuda-kernels-bench --tests --features ${{ matrix.arch }},device-tests
      - name: cargo check baracuda-cuda-emit / cuda-seam --tests (nvrtc, device-tests off / on)
        if: matrix.arch == 'sm80'
        run: |
          cargo check --locked -p baracuda-cuda-emit --tests --features nvrtc
          cargo check --locked -p baracuda-cuda-emit --tests --features nvrtc,device-tests
          cargo check --locked -p baracuda-cuda-seam --tests --features nvrtc
          cargo check --locked -p baracuda-cuda-seam --tests --features nvrtc,device-tests

  # Every declared cargo feature of every workspace crate compiles, one at a time.
  # The arch-gated job above only ever enabled sm80/sm89/sm90a (+ device-tests), so
  # features such as `mhc`, `xformers_blocksparse`, `xformers_sparse24` (and, after the
  # private-view migration, `ring_attention`) could not compile for months while every
  # check stayed green. The (crate, feature) set is DERIVED from `cargo metadata` by
  # scripts/check-each-feature.py, so a newly declared feature joins automatically.
  # DOCS_RS=1 makes the nvcc crates skip their forge, so this type-checks the Rust
  # (it does not build or run any kernel); anything that truly cannot build without
  # the toolkit must be listed in that script's NEEDS_TOOLKIT with a reason.
  each-feature-check:
    name: Every declared feature compiles (DOCS_RS check, no CUDA) (shard ${{ matrix.shard }}/4)
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    env:
      DOCS_RS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo check every (crate, feature)
        run: python3 scripts/check-each-feature.py --shard ${{ matrix.shard }}/4
