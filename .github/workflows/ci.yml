name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  build-no-cuda:
    name: Build without CUDA installed
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --style-edition is passed EXPLICITLY: cargo-fmt forwards --edition from the
      # manifest but NOT the config's style_edition, so without this flag the check
      # silently runs the pre-2024 style and disagrees with bare `rustfmt` (which
      # honors rustfmt.toml). With the flag, cargo-fmt, bare rustfmt, and the
      # rustfmt.toml pin all enforce the same strict-2024 style.
      - name: cargo fmt
        run: cargo fmt --all -- --check --style-edition 2024
      - name: cargo build
        run: cargo build --workspace
      - name: cargo clippy
        run: cargo clippy --workspace -- -D warnings
      - name: cargo test (no GPU)
        run: cargo test --workspace
      - name: cargo doc
        run: cargo doc --workspace --no-deps
      # ---- feature-gated surfaces the default --workspace build never compiles.
      # These features are deliberately CI-safe: `cuvs` is a lazy dynamic loader
      # (no RAPIDS needed to build/test; GPU-touching tests are #[ignore]d), and
      # kernelgen's `seam`/`nvrtc` pull only crates.io Rust deps (all
      # toolkit-dependent tests are #[ignore]d). Regression guard for the class
      # of bug where `missing_docs = deny` (and clippy) never fired on a
      # feature-gated module because CI never compiled it.
      - name: clippy cuvs surfaces (feature-gated)
        run: cargo clippy -p baracuda-cuvs-sys -p baracuda-cuvs --features cuvs -- -D warnings
      - name: test cuvs surfaces (feature-gated)
        run: cargo test -p baracuda-cuvs-sys -p baracuda-cuvs --features cuvs
      - name: clippy kernelgen seam+nvrtc (feature-gated)
        run: cargo clippy -p baracuda-kernelgen --features seam,nvrtc -- -D warnings
      - name: test kernelgen seam (feature-gated)
        run: cargo test -p baracuda-kernelgen --features seam
