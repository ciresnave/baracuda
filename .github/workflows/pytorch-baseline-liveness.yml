name: pytorch baseline liveness

# The bench suite's PyTorch comparison is a FROZEN timing baseline on disk
# (crates/baracuda-kernels-bench/bench-baselines/pytorch_*.json), generated
# under pinned PyTorch(s). A frozen timing ref is stable for arithmetic but NOT
# for PyTorch-the-implementation: a major release can change a covered op's
# kernel, and then a baseline run silently describes a PyTorch nobody runs. Each
# provenance run carries its own torch version; this job DETECTS a major bump so
# the staleness is visible rather than assumed away.
#
# It NEVER reds a build (being behind a torch release is legitimate — a regen is
# a deliberate, GPU-bound act) and runs ONLY on a schedule / on demand, never on
# a PR, so it cannot flake the merge path. The warning/issue names WHICH run is
# behind, not merely that something is — reporting "something here is stale" over
# a multi-run file is the `head -1` defect one level up (a confident answer about
# the set when the actionable fact is about a member).
#
# It checks ONLY condition (1) (torch MAJOR) — the one machine-detectable
# trigger. Conditions (2)-(4) (a documented numerics change, a device/toolchain
# change, new ops) are human-evaluated; the job prints them as a reminder.
on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC (offset from cuda-vocab's :17)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

# Serialize runs so a manual dispatch overlapping the weekly run cannot race the
# `gh issue list` -> `gh issue create` dedupe into creating two issues.
concurrency:
  group: pytorch-baseline-liveness
  cancel-in-progress: false

jobs:
  baseline-liveness:
    name: Are the PyTorch baseline runs' majors current?
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare each provenance run's torch major against the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          DIR=crates/baracuda-kernels-bench/bench-baselines

          # Resolve THE baseline with the loader's EXACT ambiguity rule: exactly
          # one pytorch_*.json, else skip. NOT `ls | head -1` — an arbitrary pick
          # over a set whose cardinality is the question would probe a file the
          # loader is not using (the loader disables the PyTorch column when the
          # count is not 1). The two components must agree on "the baseline".
          shopt -s nullglob
          matches=("$DIR"/pytorch_*.json)
          shopt -u nullglob
          if [ "${#matches[@]}" -eq 0 ]; then
            echo "No pytorch_*.json baseline in $DIR — nothing to check."
            echo "No PyTorch baseline present; liveness check is a no-op." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ "${#matches[@]}" -gt 1 ]; then
            echo "::warning::${#matches[@]} pytorch_*.json baselines in $DIR — ambiguous; the loader disables the PyTorch column in this state, so this probe skips too rather than pick one arbitrarily."
            { echo "### ⚠️ Multiple PyTorch baselines — ambiguous"; echo;
              echo "Found ${#matches[@]} \`pytorch_*.json\` in \`$DIR\`. The loader treats this as ambiguous and disables the PyTorch column; this probe skips for the same reason (a \`head -1\` pick would report freshness about a file the loader is not using)."; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BASELINE="${matches[0]}"
          echo "Baseline: $BASELINE"

          # Latest RELEASED torch major from PyPI (stable only — skip pre-releases).
          LATEST_VER=$(python3 - <<'PY'
          import json, urllib.request
          with urllib.request.urlopen("https://pypi.org/pypi/torch/json", timeout=30) as r:
              data = json.load(r)
          print(data["info"]["version"])  # info.version is the latest stable release
          PY
          )
          LATEST_MAJOR=$(printf '%s' "$LATEST_VER" | cut -d. -f1)
          echo "Latest released: torch $LATEST_VER (major $LATEST_MAJOR)"

          # Each provenance run has its own torch version; a partial refresh can
          # leave runs at different majors. Emit "run_id<TAB>torch_version<TAB>major"
          # per run ($BASELINE via env so a quoted heredoc needs no shell escaping).
          RUNS=$(BASELINE="$BASELINE" python3 - <<'PY'
          import json, os
          runs = json.load(open(os.environ["BASELINE"]))["metadata"].get("provenance_runs", [])
          for r in runs:
              ver = r.get("torch_version", "?")
              major = ver.split(".", 1)[0] if ver and ver[0].isdigit() else "?"
              print(f"{r.get('run_id','?')}\t{ver}\t{major}")
          PY
          )
          if [ -z "$RUNS" ]; then
            echo "Baseline has no provenance_runs (v1/legacy) — cannot check torch major."
            echo "Baseline \`$BASELINE\` has no provenance_runs; regenerate to stamp per-run provenance." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Collect the runs behind the latest major — BY NAME, not "something is stale".
          behind=""
          while IFS=$'\t' read -r run_id ver major; do
            [ -z "$run_id" ] && continue
            if [ "$major" != "?" ] && [ "$major" -lt "$LATEST_MAJOR" ]; then
              behind="${behind}- run \`$run_id\` at torch \`$ver\` (major $major)"$'\n'
            fi
          done <<< "$RUNS"

          REMINDER=$(printf '%s\n' \
            "Automated check covers condition (1) only (torch MAJOR). Also regenerate if a HUMAN observes:" \
            "  (2) a documented PyTorch numerics change (reduction algorithm, dtype-promotion default, or a covered op's kernel);" \
            "  (3) the target device or its CUDA toolchain changed;" \
            "  (4) new ops were added to the bench suite." \
            "Regenerate with: python tools/refresh_pytorch_baseline.py  (on the target GPU box; stamps a fresh v2 provenance run + git SHA + dirty bit).")

          if [ -z "$behind" ]; then
            echo "All provenance runs are at torch major >= latest ($LATEST_MAJOR) — current."
            { echo "### ✅ PyTorch baseline runs are current"; echo;
              echo "Latest released torch is \`$LATEST_VER\` (major $LATEST_MAJOR); every provenance run is at that major or newer."; echo;
              echo "$REMINDER"; } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          body=$(printf '%s\n' \
            "One or more provenance runs in the PyTorch baseline are a torch MAJOR behind the latest release (\`$LATEST_VER\`, major $LATEST_MAJOR). NOT a build failure — being behind is legitimate; a regen is a deliberate, GPU-bound act." \
            "" \
            "- **Baseline:** \`$BASELINE\`" \
            "- **Latest released:** \`$LATEST_VER\` (major $LATEST_MAJOR)" \
            "- **Runs behind:**" \
            "$behind" \
            "$REMINDER")

          echo "::warning::PyTorch baseline has run(s) behind torch major $LATEST_MAJOR — see the job summary / issue for which run(s)."
          { echo "### ⚠️ PyTorch baseline run(s) behind"; echo; echo "$body"; } >> "$GITHUB_STEP_SUMMARY"

          # Dedup by a stable title (keyed on the released major) so a persisting
          # gap does not open a fresh issue every week.
          TITLE="pytorch-baseline: run(s) behind torch major $LATEST_MAJOR"
          existing=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open \
            --search "in:title pytorch-baseline: run(s) behind" --json number --jq '.[0].number // empty' || true)
          if [ -n "$existing" ]; then
            echo "regen issue already open (#$existing) — not duplicating."
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --body "$body"
          fi

          # NEVER red — being behind is legitimate; the signal is the warning + issue.
          exit 0
