[package]
name = "baracuda-tensorrt-builder"
version = "0.1.0-alpha.65"
description = "Safe Rust API for the NVIDIA TensorRT builder: network definition, builder config, serialized engines."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["api-bindings"]

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them
# (`cargo gpu-test -p baracuda-tensorrt-builder --features shim,device-tests`).
# See docs/DEVICE-TESTS.md.
device-tests = []

default = []
# The builder API itself. Needs the C++ shim, so the TensorRT SDK headers at
# build time (see crates/baracuda-tensorrt/NOTICE.md); without it this crate is
# empty apart from `shim_built()`.
shim = ["baracuda-tensorrt/shim", "baracuda-tensorrt-sys/shim"]

[dependencies]
baracuda-tensorrt.workspace = true
baracuda-tensorrt-sys.workspace = true

[dev-dependencies]
# `require_optional!` on-device-skip primitive (declare-and-report) and a device
# to run the engines the tests build.
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
