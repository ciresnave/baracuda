[package]
name = "baracuda-nvml"
version = "0.1.0-alpha.27"
description = "Safe Rust wrappers for the NVIDIA Management Library (NVML) — driver-bundled GPU monitoring."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-nvml --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-nvml-sys.workspace = true
thiserror.workspace = true

[lints]
workspace = true
