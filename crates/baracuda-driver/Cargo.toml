[package]
name = "baracuda-driver"
version = "0.0.1-alpha.163"
description = "Safe Rust wrappers for the CUDA Driver API (devices, contexts, streams, events, memory, kernels, graphs)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
async = ["dep:futures-core"]
# The `require!` / `require_optional!` primitives for on-device tests
# (declare-and-report skippability — see src/test_support.rs). Enabled by
# downstream test crates in their dev-dependencies; no production cost.
test-support = []
# On-device integration tests (`tests/*`): built only with this feature, so a
# no-GPU `cargo test` does not compile them. NOT ignored and NOT hidden: CI
# type-checks them on every PR (`cargo clippy --all-targets --all-features`) and
# the self-hosted device runner builds and RUNS them (`cargo gpu-test -p
# baracuda-driver --features device-tests`); a stale or missing device run is a
# red check. See docs/UNVERIFIED-HARDWARE.md for what cannot run on that box.
device-tests = []

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-cuda-sys.workspace = true
thiserror.workspace = true
futures-core = { workspace = true, optional = true }

[dev-dependencies]
# `wave2_smoke` uses NVRTC to compile a fixture kernel at test time,
# avoiding hand-written PTX fragility.
baracuda-nvrtc = { path = "../baracuda-nvrtc" }  # path-only: avoid publish cycle on cargo 1.90+ (dev-dep, dropped from published manifest)
# Self dev-dep to enable the `test-support` feature (the `require!` /
# `require_optional!` on-device-skip primitives) for this crate's own
# integration tests, without turning it on for the normal build.
baracuda-driver = { path = ".", features = ["test-support"] }

[lints]
workspace = true
