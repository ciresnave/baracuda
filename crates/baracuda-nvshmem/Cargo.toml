[package]
name = "baracuda-nvshmem"
version = "0.1.0-alpha.1"
description = "Safe Rust wrappers for NVIDIA NVSHMEM host API (symmetric-heap one-sided GPU communication)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-nvshmem --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

default = []

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-cuda-sys.workspace = true
baracuda-nvshmem-sys.workspace = true
baracuda-driver.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `require_optional!` on-device-skip primitive (declare-and-report).
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
