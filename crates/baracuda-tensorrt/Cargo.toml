[package]
name = "baracuda-tensorrt"
version = "0.0.1-alpha.164"
description = "Safe Rust API for NVIDIA TensorRT runtime inference."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories = ["api-bindings"]

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-tensorrt --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

default = []
# Build + link the C++ runtime shim (forwards to baracuda-tensorrt-sys/shim).
# Required to actually run inference; needs the TensorRT SDK headers at build
# time. See AUDIT.md.
shim = ["baracuda-tensorrt-sys/shim"]

[dependencies]
baracuda-core.workspace = true
baracuda-types.workspace = true
baracuda-cuda-sys.workspace = true
baracuda-driver.workspace = true
baracuda-tensorrt-sys.workspace = true
thiserror.workspace = true

[dev-dependencies]
# `require_optional!` on-device-skip primitive (declare-and-report).
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
