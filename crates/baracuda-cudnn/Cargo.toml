[package]
name = "baracuda-cudnn"
version = "0.0.1-alpha.135"
description = "Safe Rust wrappers for NVIDIA cuDNN (classic API; activations at v0.1)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-cuda-sys.workspace = true
baracuda-cudnn-sys.workspace = true
baracuda-driver.workspace = true
thiserror.workspace = true
half = { workspace = true, optional = true }

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-cudnn --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

default = []
# Lets callers use `half::f16` / `half::bf16` directly as `CudnnDataType`.
# Forwards to `baracuda-types/half-crate` for the underlying `DeviceRepr`.
half-crate = ["dep:half", "baracuda-types/half-crate"]

[dev-dependencies]
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
