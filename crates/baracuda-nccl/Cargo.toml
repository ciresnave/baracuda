[package]
name = "baracuda-nccl"
version = "0.1.0-alpha.13"
description = "Safe Rust wrappers for NVIDIA NCCL (multi-GPU collective communication)."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-nccl --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

default = []
# Opt-in NcclScalar impls for `half::f16` and `half::bf16`. Transitively
# enables `baracuda-types`'s half-crate feature so DeviceRepr is in
# place on these types.
half-crate = ["dep:half", "baracuda-types/half-crate"]

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-cuda-sys.workspace = true
baracuda-nccl-sys.workspace = true
baracuda-driver.workspace = true
thiserror.workspace = true
half = { workspace = true, optional = true }

[dev-dependencies]
# `require_optional!` on-device-skip primitive (declare-and-report).
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
