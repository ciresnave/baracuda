[package]
name = "baracuda-kernelgen"
version = "0.0.1-alpha.77"
description = "Kernel generator + the live JIT synthesizer for the Fuel kernel seam. The SUPPORTED surface is the `seam` feature (BaracudaSynthesizer, the fuel-kernel-seam Synthesizer impl); the generator internals (IR, emitters, contracts, dispatch artifacts) are alpha-fluid — pin exact versions."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
# Published as of alpha.76 so Fuel can construct BaracudaSynthesizer from
# crates.io (their build discipline forbids path deps). The alpha exact-pin
# lockstep means no cross-version API stability is implied anywhere.

[features]
# Pull in the real on-demand nvrtc compiler (NvrtcCompiler). Off by default so the
# synthesis engine + StubCompiler build and test without a CUDA toolchain; enable
# with `--features nvrtc` where nvrtc is available.
nvrtc = ["dep:baracuda-nvrtc"]
# Wire Fuel's frozen kernel-seam grammar (`fuel_kernel_seam_types::PatternNode`) as
# the JIT region type AND the live-call envelope (`fuel_kernel_seam::Synthesizer`,
# `JitRequest`/`JitResponse`) — the direct-Rust §5 endpoint Fuel calls.
seam = ["dep:fuel-kernel-seam-types", "dep:fuel-kernel-seam"]
# The source-language CONVERTERS (IR-hub Phase 4): tree-sitter frontends that lift
# existing CUDA / Slang kernels into the neutral IR. Optional so the published
# default build stays lean — the grammars compile C via the `cc` crate; enable with
# `--features convert`.
convert = ["dep:tree-sitter", "dep:tree-sitter-cuda", "dep:tree-sitter-slang"]

[dependencies]
baracuda-kernel-vocab = { workspace = true }
# Accurate f64 transcendentals (erf/erfc) for the CPU oracle reference — a pure-Rust
# (MUSL/fdlibm heritage) implementation INDEPENDENT of the emitter's device erf/erff,
# so it remains a valid differential oracle. Replaces the v1 ~1e-7 rational that was
# too loose to reference an f32/f64 erf/gelu kernel (adversarial review).
libm = "0.2"
baracuda-nvrtc = { workspace = true, optional = true }
# Fuel's dependency-free std-POD grammar crate (OpTag / OpAttrs / PatternNode) — the
# §5 shared wire vocabulary. crates.io version dep so the default build resolves
# without a Fuel checkout (an unpublished path/git dep breaks workspace resolution).
fuel-kernel-seam-types = { version = "0.10.3", optional = true }
# The §5 live-call envelope: JitRequest / JitResponse / the Synthesizer trait Fuel
# calls. Depends only on fuel-kernel-seam-types + baracuda-kernels-types (no fuel-graph).
# 0.10.3 = the frozen two-step handover: take_kernel ON the trait; JitResponse light
# handle (Synthesized{entry_point}); envelope SynthArtifact{artifact,kind(Ptx|Cubin),
# link,contract}; JitRequest.budget.
fuel-kernel-seam = { version = "0.10.3", optional = true }
# Human-readable / -writable IR text form (IR-hub Phase 3): the neutral `OpDef`
# IR derives Serialize/Deserialize so an op can be authored/inspected/diffed as
# pretty JSON and round-tripped (see `src/text.rs`, `op_to_text`/`op_from_text`).
# Plain (non-optional) deps: the round-trip surface is always available and the
# `--lib` tests exercise it under the default feature set.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Converter frontends (`convert` feature): reuse mature tree-sitter grammars to lift
# CUDA / Slang source into the IR instead of hand-writing parsers. Error-tolerant
# CSTs — unrecognized constructs stay as residue (the "keep the rest in the source
# language" contract). tree-sitter-cuda extends tree-sitter-cpp; tree-sitter-slang
# extends tree-sitter-cpp + tree-sitter-hlsl.
tree-sitter = { version = "0.26", optional = true }
tree-sitter-cuda = { version = "0.21", optional = true }
tree-sitter-slang = { version = "0.3", optional = true }

[dev-dependencies]
# kiss-ref: the spec-exact KISS reference impl — the single source of truth this
# crate's numerical tests assert against (the oracle.rs consolidation). DEV-only,
# so it is NOT in the published lib's dependency graph and `cargo publish` / the
# no-CUDA CI stay clean. Pinned; the API is additive since 0.1.0 (Error is
# #[non_exhaustive]). The in-tree `kiss_ref_diff` #[cfg(test)] module converts a
# Baracuda emitted recipe to a kiss-ref FlatDag and diffs eval_recipe.
kiss-ref-core = "0.1.0"
kiss-ops-vocab = "0.1.0"
kiss-classify-vocab = "0.1.0"

[lints]
workspace = true
