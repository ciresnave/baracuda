[package]
name = "baracuda-nvcomp"
version = "0.1.0-alpha.54"
description = "Safe Rust wrappers for NVIDIA nvCOMP (GPU compression). Scaffolding at v0.1."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-nvcomp --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-nvcomp-sys.workspace = true
thiserror.workspace = true

[dev-dependencies]
baracuda-runtime = { path = "../baracuda-runtime" }  # path-only: avoid publish cycle on cargo 1.90+ (dev-dep, dropped from published manifest)
# `require_optional!` on-device-skip primitive (declare-and-report).
baracuda-driver = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
