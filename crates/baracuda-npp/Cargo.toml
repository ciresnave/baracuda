[package]
name = "baracuda-npp"
version = "0.1.0-alpha.65"
description = "Safe Rust wrappers for NVIDIA NPP (Performance Primitives). Core + signal subset at v0.1."
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-npp --features device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

[dependencies]
baracuda-types.workspace = true
baracuda-core.workspace = true
baracuda-npp-sys.workspace = true
baracuda-driver.workspace = true
thiserror.workspace = true

[lints]
workspace = true
