[package]
name = "baracuda-cuda-seam"
version = "0.1.0-alpha.48"
description = "The Fuel kernel-seam `Synthesizer` implementation (`BaracudaSynthesizer`) over the CUDA backend in `baracuda-cuda-emit`."
edition.workspace = true
# No `rust-version.workspace = true`: no MSRV CI job builds this crate under 1.88
# (fuel's seam crates' own floor is unmeasured), so declaring it would be an
# untested floor -- see the workspace note.
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
[features]
# Real on-demand NVRTC compile (needs the CUDA toolkit at run time). Off by
# default: the synthesizer then falls back to `unpopped::StubCompiler`.
nvrtc = ["baracuda-cuda-emit/nvrtc"]

# On-device integration tests: built only with this feature, so a plain `cargo test`
# never compiles or runs a test that needs a GPU. CI type-checks them and the
# self-hosted device runner builds and RUNS them (`cargo gpu-test -p baracuda-cuda-seam --features nvrtc,device-tests ...`).
# See docs/DEVICE-TESTS.md.
device-tests = []

[dependencies]
baracuda-cuda-emit = { workspace = true }
unpopped = { workspace = true }
unpopped-vocab = { workspace = true }
# The §5 shared wire grammar + live-call envelope Fuel calls: registry versions
# (standing rule: no git deps). 0.22 added `JitRequest::target` and
# `OpAttrs::region_key()`; 0.28.0 is the current release (first on unpopped-vocab 0.32.1). Both crates must be the SAME
# line so the graph holds one copy of `fuel-kernel-seam-types`. Caret, not `=`: Fuel's own
# workspace carries newer 0.26 patch releases of the same crates, and an exact pin cannot
# unify with them (two copies, E0308 at lib.rs:275,283).
fuel-kernel-seam-types = "0.28.0"
fuel-kernel-seam = "0.28.0"

[lints]
workspace = true
