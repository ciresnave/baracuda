[package]
name = "kiss-ref-diff"
version = "0.0.0"
edition = "2021"
publish = false

# DELIBERATELY NOT a workspace member (the root members list is crates/*,
# xtask, examples): this tool carries the ON-DEVICE differential legs (NVRTC JIT
# + GPU launch), so RUNNING it needs a CUDA toolkit + a GPU.
#
# ⚠️ TYPE-CHECKING IT NEEDS NEITHER, and conflating the two is what let this
# file rot. `cargo check` here compiles in ~18s on a driver-free machine
# (baracuda-driver / baracuda-nvrtc are lazy-libloading, cuda-emit is pure
# Rust), so CI now type-checks it -- see the step in .github/workflows/ci.yml.
# These pins went NINE MINOR VERSIONS stale and the tool stopped compiling at
# all, with no signal, because three exclusions intersected: the root
# Cargo.lock cannot see it (its own [workspace] is a second resolution root),
# no CI job built it, and no `cargo update` reaches a 0.1.x pin. See #122.
# kiss-ref is now PUBLIC + on crates.io, so its deps are normal version pins;
# this tool adds the device legs on top of the CPU-only oracle Unpopped already
# tests against. Build + run it explicitly on a CUDA box — see README.md.
[workspace]

[[bin]]
name = "kiss-ref-diff"
path = "main.rs"

[dependencies]
# Published crates.io pin (was git rev 417cc2e, pre-publish). Matches Unpopped's
# own pin (bumped to 0.3.4 in Unpopped#24, Dtype::S8->I8 rename + a new
# complex.rs module -- neither touches a dtype variant this tool constructs)
# so the CPU legs stay byte-identical across both. Coordinated directly with
# the Unpopped lane before bumping past 0.2.3 (#130).
kiss-ref-core = "0.3.4"
kiss-ops-vocab = "0.3.4"
kiss-classify-vocab = "0.3.4"
unpopped = "0.14.3"
# `Cuda` (the emitter the differential lowers through) moved to the CUDA backend
# crate in the Unpopped carve; the neutral generator stays for `generate`/IR.
baracuda-cuda-emit = { path = "../../crates/baracuda-cuda-emit" }
unpopped-vocab = "0.14.3"
# Step-3a device leg: JIT the generated kernel via NVRTC, launch on the GPU.
baracuda-driver = { path = "../../crates/baracuda-driver" }
baracuda-nvrtc = { path = "../../crates/baracuda-nvrtc" }
