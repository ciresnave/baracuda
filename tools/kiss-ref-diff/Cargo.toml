[package]
name = "kiss-ref-diff"
version = "0.0.0"
edition = "2021"
publish = false

# DELIBERATELY NOT a workspace member (the root members list is crates/*,
# xtask, examples): kiss-ref is a PRIVATE repo, so this tool cannot ride the
# published workspace or default CI. Build it explicitly — see README.md.
[workspace]

[[bin]]
name = "kiss-ref-diff"
path = "main.rs"

[dependencies]
# 417cc2e = 004e1a4 surface + conformance/fuzz suites + Node::Flip + scatter
# broadcast-updates (additive; Provisional pending the KISS ruling).
kiss-ref-core = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "417cc2e" }
kiss-ops-vocab = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "417cc2e" }
kiss-classify-vocab = { git = "https://github.com/ThinkersJournal/kiss-ref", rev = "417cc2e" }
baracuda-kernelgen = { path = "../../crates/baracuda-kernelgen" }
baracuda-kernel-vocab = { path = "../../crates/baracuda-kernel-vocab" }
# Step-3a device leg: JIT the generated kernel via NVRTC, launch on the GPU.
baracuda-driver = { path = "../../crates/baracuda-driver" }
baracuda-nvrtc = { path = "../../crates/baracuda-nvrtc" }
